# Gradle properties
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# 项目路径包含非 ASCII 字符（中文目录），关闭 Android Gradle 路径检查
android.overridePathCheck=true

# MNN 引擎：libMNN.so 头文件 + 预编译库（NDK 交叉编译，c++_shared，含 LLM+OpenCL+ARM82+transformer-fuse）
# D:/mnn-matched/include <- D:/MNN-src/include（MNN 核心）+ transformers/llm/engine/include/llm（llm.hpp）
# D:/mnn-matched/lib     <- D:/MNN-src/project/android/build_64/libMNN.so（6.3MB，arm64-v8a）
# 配置后 externalNativeBuild 会用 NDK 从 cpp/mnn_jni.cpp 编译 libmnn_jni.so，链接 libMNN.so
# 运行时 libMNN.so 由 jniLibs 打包，MnnBridge 加载（MNN -> mnn_jni 顺序）。
# 注意：build.gradle.kts 用 providers.gradleProperty("MNN_DIR") 读取，所以写在这里（gradle.properties）。
# cpu_sys_jni（CPU 频率/拓扑只读 JNI）始终编译，无需此处配置。
MNN_DIR=D:/mnn-matched
